name: "🌩️ CloudRizzle AI — CI/CD Pipeline"

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy to environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/cloudrizzle-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/cloudrizzle-frontend

# ─────────────────────────────────────────────
jobs:

# ================= CODE QUALITY =================
  code-quality:
    name: "🔍 Code Quality"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache backend deps
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-${{ runner.os }}-${{ hashFiles('backend/package.json') }}

      - name: Cache frontend deps
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}

      - name: Install backend deps
        working-directory: backend
        run: npm ci || npm install

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Lint backend
        working-directory: backend
        run: npm run lint --if-present

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

# ================= BACKEND TEST =================
  backend-test:
    name: "🧪 Backend Tests"
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudrizzle_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: cloudrizzle_test
      DB_USER: postgres
      DB_PASSWORD: testpassword
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-jwt-secret-min-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        working-directory: backend
        run: npm ci || npm install

      - name: Install redis tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
          until redis-cli -h localhost ping | grep -q PONG; do sleep 1; done

      - name: Run tests
        working-directory: backend
        run: npm test -- --passWithNoTests

      - name: API smoke test
        working-directory: backend
        run: |
          set -e
          node src/index.js &
          PID=$!
          sleep 5
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:5000/health)
          kill $PID || true
          [ "$CODE" = "200" ]

# ================= FRONTEND =================
  frontend-test:
    name: "🖥️ Frontend Build & Test"
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Test
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: false

# ================= SECURITY =================
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v4

      - name: Backend audit
        working-directory: backend
        run: npm install && npm audit --audit-level=high || true

      - name: Frontend audit
        working-directory: frontend
        run: npm install && npm audit --audit-level=high || true

# ================= DOCKER BUILD =================
  docker-build:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan]

    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

# ================= STAGING DEPLOY =================
  deploy-staging:
    name: "🚀 Deploy Staging"
    runs-on: ubuntu-latest
    needs: docker-build

    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/cloudrizzle

          cat > .env <<EOT
          NODE_ENV=staging
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          IMAGE_TAG=${{ github.sha }}
          EOT

          docker pull ${{ secrets.DOCKER_USERNAME }}/cloudrizzle-backend:${{ github.sha }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/cloudrizzle-frontend:${{ github.sha }}

          IMAGE_TAG=${{ github.sha }} docker compose up -d --remove-orphans
          curl -sf --max-time 5 http://localhost:5000/health
          EOF
